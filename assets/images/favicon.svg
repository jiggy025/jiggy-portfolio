<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="jpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="#07080b"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Subtle Corner Grid Tech Accent -->
  <circle cx="54" cy="10" r="1.5" fill="#ef4444" filter="url(#crimsonGlow)"/>

  <!-- Monogram JP -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- J: Precision Hook -->
    <path d="M22 17 v23 a 8 8 0 0 1 -16 0 v-4" stroke="url(#jpGrad)" stroke-width="5"/>
    
    <!-- P: Architectural Stem & Loop -->
    <path d="M34 47 V 17 h 11 a 7.5 7.5 0 0 1 0 15 H 34" stroke="url(#jpGrad)" stroke-width="5"/>
    
    <!-- Crimson Precision Accent Dot on J head -->
    <circle cx="22" cy="17" r="2.5" fill="#ef4444" stroke="#ef4444" stroke-width="1"/>
  </g>
</svg>
